<!doctype html>
<html lang='en'>
<head>
  <meta charset='UTF-8' />
  <meta name='viewport' content='width=device-width, initial-scale=1.0' />
  <title>Login - Weekly HW Calculator</title>

  <link href='https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css' rel='stylesheet'>

  <script src='js/login.js' defer></script>
</head>
<body class='bg-light'>
  <div class='container d-flex align-items-center justify-content-center' style='min-height: 100vh;'>
    <div class='card shadow-sm' style='width: 100%; max-width: 400px;'>
      <div class='card-body p-4'>
        <h1 class='h3 mb-3 text-center'>Log In</h1>
        <p class='text-muted small text-center mb-4'>No account yet? Just enter a username and password and one will be created for you.</p>

        <form id='login-form'>
          <div class='mb-3'>
            <label for='username' class='form-label'>Username</label>
            <input type='text' class='form-control' id='username' name='username' required>
          </div>
          <div class='mb-3'>
            <label for='password' class='form-label'>Password</label>
            <input type='password' class='form-control' id='password' name='password' required>
          </div>
          <div id='login-error' class='alert alert-danger d-none' role='alert'></div>
          <button type='submit' class='btn btn-primary w-100'>Log In</button>
        </form>
      </div>
    </div>
  </div>
</body>
</html>
