<!doctype html>
<html lang='en'>
<head>
  <meta charset='UTF-8' />
  <meta name='viewport' content='width=device-width, initial-scale=1.0' />
  <title>Weekly HW Calculator</title>
  <link href='https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css' rel='stylesheet'>
  <script src='js/app.js' defer></script>
</head>
<body class='bg-light'>
  <nav class='navbar navbar-light bg-white border-bottom mb-4'>
    <div class='container'>
      <span class='navbar-brand mb-0 h1'>Weekly HW Calculator</span>
      <div class='d-flex align-items-center gap-3'>
        <span id='current-user' class='text-muted small'></span>
        <button id='logout-btn' class='btn btn-outline-secondary btn-sm'>Log out</button>
      </div>
    </div>
  </nav>

  <div class='container'>
    <div class='row g-4'>
      <div class='col-md-4'>
        <div class='card'>
          <div class='card-body'>
            <h2 class='h5 card-title'>Add a task</h2>
            <form id='todo-form'>
              <div class='mb-3'>
                <label for='task' class='form-label'>Task</label>
                <input type='text' class='form-control' id='task' required maxlength='120'>
              </div>
              <div class='mb-3'>
                <label for='priority' class='form-label'>Priority</label>
                <select class='form-select' id='priority'>
                  <option value='high'>High &mdash; due in 1 day</option>
                  <option value='medium' selected>Medium &mdash; due in 3 days</option>
                  <option value='low'>Low &mdash; due in 7 days</option>
                </select>
              </div>
              <button type='submit' class='btn btn-primary w-100'>Add task</button>
            </form>
          </div>
        </div>
      </div>

      <div class='col-md-8'>
        <div class='card'>
          <div class='card-body'>
            <h2 class='h5 card-title'>Your tasks</h2>
            <table class='table align-middle'>
              <thead>
                <tr><th>Task</th><th>Priority</th><th>Deadline</th><th></th></tr>
              </thead>
              <tbody id='todo-body'></tbody>
            </table>
            <p id='empty-state' class='text-muted fst-italic' hidden>No tasks yet, add one!</p>
          </div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
